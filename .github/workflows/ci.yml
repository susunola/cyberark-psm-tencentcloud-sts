name: Validate source and build distribution
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Mypy strict typing
        run: python -m mypy
      - name: Dependency hashes are complete
        run: python scripts/pin_lock_hashes.py --check
      - name: Unit tests with coverage gate
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report
  advisories:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt
      # Fails when a published advisory covers a pinned dependency. A new advisory
      # is a real finding, so this job is intentionally allowed to fail the build.
      - name: Audit pinned dependencies
        run: python -m pip_audit -r requirements.lock.txt --progress-spinner off
  guard-mutations:
    name: Security guards are enforced by tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt
      # Disables one security guard at a time and requires the suite to fail.
      - run: python scripts/check_guard_mutations.py
  windows-installer:
    name: Windows installer, service and ACLs
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      WINSW_URL: https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe
      WINSW_SHA256: 05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da
      INSTALL_DIR: C:\PSM-TencentCloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # Run the installer for real: administrator rights, icacls DACLs, a WinSW service
      # under LocalService, and the hash-pinned dependency install. Everything here is
      # behaviour that cannot be observed from Linux or macOS, so the statements live in
      # scripts/ci/ where tests/test_powershell_syntax.py parses every one of them. A step
      # that inlines PowerShell instead is invisible to the parser and only reports its own
      # syntax errors on a Windows runner, which tests/test_hardening.py therefore refuses.
      - name: Fetch WinSW and confirm the pinned artifact
        shell: pwsh
        run: ./scripts/ci/fetch-winsw.ps1
      - name: Write a synthetic settings file
        shell: pwsh
        run: ./scripts/ci/write-acceptance-settings.ps1
      - name: A tampered WinSW binary must be refused before anything is written
        shell: pwsh
        run: ./scripts/ci/assert-tampered-winsw-refused.ps1
      - name: Install the service and capture the installer output
        shell: pwsh
        run: ./scripts/ci/install-service.ps1
      - name: Assert the ACLs the installer is supposed to apply
        shell: pwsh
        run: ./scripts/ci/assert-installer-acls.ps1
      - name: The installed service answers an authenticated readiness probe
        shell: pwsh
        run: ./scripts/ci/assert-readiness-probe.ps1
      - name: Uninstall keeps the files and stops the service
        shell: pwsh
        run: ./scripts/ci/assert-uninstall-preserves-files.ps1
      - name: Stage the diagnostics inside the workspace
        if: always()
        shell: pwsh
        run: ./scripts/ci/stage-diagnostics.ps1
      # upload-artifact refuses any path outside the workspace root, and the install
      # directory is on the same drive but outside the checkout, so it is staged first.
      - name: Collect diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
  shared-tokens:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.2.5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s tests -v
        env:
          PSM_TEST_REDIS_URL: redis://127.0.0.1:6379/15
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.12', '3.13', '3.14']
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # requirements-dev.txt is installed so the property and invariant suites run
      # rather than skipping on a missing test tooling dependency.
      - run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py configuration.py federation.py security.py runtime.py version.py scripts pam
      - run: python scripts/build_release.py --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-${{ matrix.os }}-${{ matrix.python }}
          path: dist/
  # One attested artifact set per run, from the leg with the stable name rather than from
  # all eight. The build is reproducible (the suite asserts it), so this copy is the same
  # source as any other leg's. Elevated permissions stay in this job alone.
  provenance:
    name: Attest the release artifacts
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-ubuntu-24.04-3.13
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
