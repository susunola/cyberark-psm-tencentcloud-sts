# Local quality gates. Enable once per clone with: pre-commit install
# Every revision below is an immutable upstream tag; pinning keeps the hooks reproducible.
minimum_pre_commit_version: "3.0.0"
default_language_version:
  python: python3
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # Local hook so mypy resolves against this repository's pyproject.toml and the
  # developer's own environment rather than an isolated pre-commit venv.
  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy (strict)
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
